name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the master branch
  push:
    branches:
    - master
    
  

concurrency:
  # prevent overlapping runs from hammering the same account's GraphQL query
  # at once, which makes GitHub's resource-limit rejection more likely
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      # wrapped in a retry: this account intermittently hits GitHub's GraphQL
      # "Resource limits for this query exceeded" on a single attempt, so retry
      # a few times with a delay before giving up for the night
      - name: generate github-contribution-grid-snake.svg
        uses: Wandalen/wretry.action@v3
        with:
          action: Platane/snk/svg-only@v3
          with: |
            github_user_name: ${{ github.repository_owner }}
            outputs: |
              dist/github-contribution-grid-snake.svg
              dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          attempt_limit: 10
          attempt_delay: 20000

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
